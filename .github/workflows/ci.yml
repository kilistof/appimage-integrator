name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / system Python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The system interpreters cover the supported minimum and a newer LTS.
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash python3 gcc libc6-dev desktop-file-utils libglib2.0-bin shellcheck

      - name: Check shell syntax and lint
        run: |
          test -x ./appimage-integrator
          bash -n ./appimage-integrator
          shellcheck ./appimage-integrator

      - name: Run regression tests as an ordinary user
        run: |
          # Use the OS interpreter for the suite and the embedded helper alike.
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/python3 --version
          /usr/bin/python3 tests/test_appimage_integrator.py

      - name: Verify that integration refuses root
        run: |
          # Only this refusal test runs as root; it must not extract the fixture.
          sudo /usr/bin/python3 tests/test_appimage_integrator.py \
            IntegrationTests.test_root_execution_refused
